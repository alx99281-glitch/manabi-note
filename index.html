<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まなびノート</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まなびノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F2FB">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one centered graph-paper notebook column (max 980px); quiz screens split into question | scratch pad on wide tablets, stacked when narrow */
:root{
  --paper:#F6F2FB; --grid:#E8E0F3; --card:#FFFFFF; --ink:#261F38; --muted:#675C7E; --line:#DCD2EA;
  --accent:#6A3FA8; --accent-ink:#FFFFFF; --accent-soft:#EEE5F9;
  --gold:#B97C10; --red:#D9433A; --ok:#2E8B57; --ok-soft:#E2F3E8; --ng-soft:#FBE6E4; --mark:#F6D776;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#18131F; --grid:#221B2C; --card:#211A2B; --ink:#EEE8F6; --muted:#AEA2C3; --line:#3A3049;
  --accent:#B99BEA; --accent-ink:#1A1126; --accent-soft:#33284A;
  --gold:#E3B04B; --red:#F07167; --ok:#5FD08A; --ok-soft:#1D3527; --ng-soft:#3A2321; --mark:#6B5A1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#18131F; --grid:#221B2C; --card:#211A2B; --ink:#EEE8F6; --muted:#AEA2C3; --line:#3A3049;
  --accent:#B99BEA; --accent-ink:#1A1126; --accent-soft:#33284A;
  --gold:#E3B04B; --red:#F07167; --ok:#5FD08A; --ok-soft:#1D3527; --ng-soft:#3A2321; --mark:#6B5A1E; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;line-height:1.3}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.abox:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-kanji);font-size:1.7rem;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{border:2px solid var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.05rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:64px;font-size:1.25rem;padding:0 30px}
.btn.small{min-height:40px;padding:0 14px;font-size:.92rem}
.btn.quit{min-height:48px;padding:0 18px;border-color:var(--red);color:var(--red);background:var(--card);font-size:1rem;gap:6px;flex-shrink:0}
.btn.quit span{font-size:1.1rem;line-height:1}
.btn.quit:active{background:var(--ng-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.muted{color:var(--muted)}
.en{color:var(--muted);font-size:.88rem;line-height:1.4}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;align-items:flex-start}
.tile .k{font-family:var(--f-kanji);font-size:2.2rem;line-height:1}
.status{font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.status.todo{background:var(--ng-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;color:var(--muted)}
.dot{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.dot.on{border:0}
/* quiz */
.qhead{display:flex;align-items:center;gap:14px}
.qhead .bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.qhead .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qhead .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.prompt{font-size:1.1rem;font-weight:700}
.word{font-family:var(--f-kanji);font-size:clamp(3rem,11vw,5.5rem);line-height:1.2;text-align:center;letter-spacing:.06em;padding:12px 0}
.word .tk{background:linear-gradient(transparent 72%,var(--mark) 72%)}
.yomi{text-align:center;font-size:1.5rem;letter-spacing:.2em;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{min-height:70px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.6rem;font-weight:700;letter-spacing:.08em}
.choice.ok{background:var(--ok-soft);border-color:var(--ok)}
.choice.ng{background:var(--ng-soft);border-color:var(--red)}
.choice.idk{grid-column:1/-1;min-height:48px;font-size:1rem;letter-spacing:0;color:var(--muted)}
.fb{min-height:34px;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--red)}
.qm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.qm{grid-template-columns:1fr}}
/* short screens (Safari toolbars in landscape): tighten the math card so it fits without scrolling */
@media (max-height:760px){.qm .card{gap:8px;padding:12px 20px}.keypad button{min-height:44px}.qm .btn.big{min-height:54px}.qm .fb .btn{min-height:44px}canvas.pad{height:clamp(240px,calc(100dvh - 330px),380px)}}
.mq{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:700;line-height:1.5;font-variant-numeric:tabular-nums}
.mq.long{font-size:1.25rem}
.mq ruby rt{font-size:.5em;font-weight:500}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .15em;font-size:.85em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.tag{align-self:flex-start;font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft)}
.ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.3rem;font-weight:700}
.abox{min-width:96px;height:62px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:1.9rem;font-variant-numeric:tabular-nums;cursor:pointer}
.abox.act{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fbox{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.fbox .abox{min-width:80px;height:54px}
.fline{width:96px;height:3px;background:var(--ink);border-radius:2px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:360px}
.keypad button{min-height:58px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700}
.keypad button:active{background:var(--accent-soft)}
.padwrap{display:flex;flex-direction:column;gap:8px}
.padhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.padtools{display:flex;gap:8px;justify-content:center}
.padtools .btn{min-height:44px;gap:6px}
.padtools .btn:disabled{opacity:.4}
.cheer{font-size:1.35rem;color:var(--accent)}
.cheer small{display:block;font-size:.85rem;color:var(--muted);font-weight:700}
canvas.pad{width:100%;height:380px;border-radius:12px;border:2px solid var(--line);background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;touch-action:none;display:block}
.wrow{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
/* write card: everything must fit one screen. Landscape = box left, controls right; portrait = stacked. --wb is the box size left over after the fixed rows */
#app:has(.qhead){padding-block:12px 16px;gap:12px}
.wcard{display:grid;gap:12px 28px;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"box head" "box ctrl";align-items:center;--wb:clamp(240px,calc(100vh - 220px),500px);--wb:clamp(240px,calc(100dvh - 220px),500px)}
.wcard .whead{grid-area:head;display:flex;flex-direction:column;gap:4px;align-self:end}
.wcard .wboxwrap{grid-area:box;justify-self:center}
.wcard .wctrl{grid-area:ctrl;display:flex;flex-direction:column;gap:12px;align-self:start}
.wcard .word{font-size:clamp(2.4rem,7vw,4rem);padding:0}
.wcard .word .wans{color:var(--red)}
.wcard .padtools{flex-wrap:wrap}
@media (orientation:portrait),(max-width:760px){
  .wcard{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "box" "ctrl";--wb:clamp(220px,min(calc(100vh - 610px),86vw),520px);--wb:clamp(220px,min(calc(100dvh - 610px),86vw),520px)}
  .wcard .whead,.wcard .wctrl{align-self:auto}}
.wact{justify-content:center}
.wres{display:flex;gap:16px;align-items:center;justify-content:center}
.sobtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0;color:var(--muted);font-size:.8rem;font-weight:700}
.sofig{width:160px;height:160px;border:2px solid var(--line);border-radius:8px;background:var(--card)}
.sofig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sofig .sog{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2}
.sofig .sobg{stroke:var(--line);stroke-width:3.2}
.sofig .sos{stroke:var(--ink);stroke-width:3.2}
.sofig .sos.bad{stroke:var(--red)}
.sofig .sn{font-size:8px;font-weight:700;fill:var(--accent);font-family:var(--f-ui)}
.sofig .sn.bad{fill:var(--red)}
.wverdict{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.vmark{font-size:2.6rem;line-height:1;font-weight:700}
.vmark.g2{color:var(--red)} .vmark.g1{color:var(--gold)} .vmark.g0{color:var(--muted)}
.vmsg{font-weight:700;line-height:1.5} .vmsg.ng small{color:var(--muted)}
.wverdict .row{gap:8px}.wverdict .btn{min-height:48px;padding:0 16px}
.wbox{position:relative;width:var(--wb,min(320px,80vw));aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:6px;background:var(--card)}
.wbox::before,.wbox::after{content:"";position:absolute;pointer-events:none}
.wbox::before{left:50%;top:0;bottom:0;border-left:2px dashed var(--line)}
.wbox::after{top:50%;left:0;right:0;border-top:2px dashed var(--line)}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.wbox .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kanji);font-size:calc(var(--wb,320px)*.78);line-height:1;color:var(--red);opacity:.22;z-index:1;pointer-events:none}
.model{display:flex;flex-direction:column;align-items:center;gap:4px}
.model b{font-family:var(--f-kanji);font-size:min(200px,40vw);line-height:1.1;font-weight:600}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grade3 button{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.05rem}
/* results / parent */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score .big{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.misslist{display:flex;flex-wrap:wrap;gap:8px}
.miss{padding:6px 12px;border-radius:10px;background:var(--ng-soft);font-size:1rem}
.miss b{font-family:var(--f-kanji);font-size:1.3rem;margin-right:6px}
.kbar{display:grid;grid-template-columns:70px minmax(0,1fr) 110px;align-items:center;gap:10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.82rem;letter-spacing:.04em}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8rem;white-space:nowrap}
.chip.m{background:var(--ok-soft);color:var(--ok)} .chip.l{background:var(--ng-soft);color:var(--red)} .chip.n{background:var(--line);color:var(--muted)} .chip.s{background:var(--accent-soft)}
.toggle{display:flex;align-items:center;gap:10px}
.sw{width:54px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:left .2s}
.sw.on{background:var(--accent)} .sw.on::after{left:27px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--ng-soft)}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.popin{animation:pop .45s ease-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.popin,.shake{animation:none}.qhead .bar i,.sw,.sw::after{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- kanji bank: kanji / example word / reading of the word ---------- */

const IV=[0,1,3,7,14,30];
function srsKanji(k,ok){
  let s=st.kanji[k];
  if(!s){s=st.kanji[k]={b:ok?3:0,c:0,w:0}}
  else s.b=ok?Math.min(s.b+1,5):0;
  if(ok)s.c++;else s.w++;
  s.due=TODAY()+IV[s.b];
}
function kanjiLevel(){ // highest grade passed in the level test (>=80%), counted from 1年
  if(!st.kt)return 0; let p=0;
  for(const g of [1,2,3,4]){const x=st.kt.r[g];if(x&&x.n&&x.c/x.n>=.8)p=g;else break}
  return p;
}
function kanjiPlan(n=10){
  const t=TODAY();
  const due=Object.keys(st.kanji).filter(k=>KINFO[k]&&st.kanji[k].due<=t).sort((a,b)=>st.kanji[a].b-st.kanji[b].b||st.kanji[a].due-st.kanji[b].due).slice(0,7);
  const out=due.slice(); const wg=Math.min(4,kanjiLevel()+1);
  const unseen=g=>KJ[g].filter(o=>!st.kanji[o.k]&&!out.includes(o.k)).map(o=>o.k);
  for(let g=1;g<wg&&out.length<n;g++){for(const k of unseen(g).slice(0,Math.min(3,n-out.length)))out.push(k);if(out.length>=due.length+3)break}
  for(let g=wg;g<=4&&out.length<n;g++)for(const k of unseen(g)){if(out.length>=n)break;out.push(k)}
  if(out.length<n){const extra=shuffle(Object.keys(st.kanji).filter(k=>KINFO[k]&&!out.includes(k)));while(out.length<n&&extra.length)out.push(extra.shift())}
  return out.map(k=>mkKanji(KINFO[k]));
}
/* wrong-answer choices: near-miss spellings of the right reading plus other real readings */
const DAK={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ',ぱ:'ば',ぴ:'び',ぷ:'ぶ',ぺ:'べ',ぽ:'ぼ'};
const UNDAK={};for(const[a,b]of Object.entries(DAK))if(!'ぱぴぷぺぽ'.includes(a))UNDAK[b]=a;
const OROW='おこそとのほもよろごぞどぼぽょ', TSUOK='かきくけこさしすせそたちつてとぱぴぷぺぽ', SMALL={ゃ:'や',ゅ:'ゆ',ょ:'よ'}, IROW='きしちにひみりぎじびぴ';
function mutate(r){
  const a=[...r], ops=shuffle(['dak','tsu','long','small']);
  for(const op of ops){
    if(op==='dak'){const idx=a.map((c,i)=>(DAK[c]||UNDAK[c])?i:-1).filter(i=>i>=0);if(idx.length){const i=pick(idx);const b=a.slice();b[i]=DAK[a[i]]||UNDAK[a[i]];return b.join('')}}
    if(op==='tsu'){if(a.includes('っ')){const b=a.slice();b.splice(a.indexOf('っ'),1);return b.join('')}
      const idx=a.map((c,i)=>i>0&&TSUOK.includes(c)&&!'っんゃゅょ'.includes(a[i-1])?i:-1).filter(i=>i>=0);if(idx.length){const b=a.slice();b.splice(pick(idx),0,'っ');return b.join('')}}
    if(op==='long'){const i=a.findIndex((c,j)=>OROW.includes(c)&&a[j+1]==='う');if(i>=0){const b=a.slice();b.splice(i+1,1);return b.join('')}
      const idx=a.map((c,j)=>OROW.includes(c)?j:-1).filter(j=>j>=0);if(idx.length){const b=a.slice();b.splice(pick(idx)+1,0,'う');return b.join('')}}
    if(op==='small'){const i=a.findIndex(c=>SMALL[c]);if(i>=0){const b=a.slice();b[i]=SMALL[a[i]];return b.join('')}
      const j=a.findIndex((c,x)=>x>0&&'やゆよ'.includes(c)&&IROW.includes(a[x-1]));if(j>=0){const b=a.slice();b[j]={や:'ゃ',ゆ:'ゅ',よ:'ょ'}[a[j]];return b.join('')}}
  }
  return null;
}
function choicesFor(o){
  const set=new Set();
  for(let i=0;i<20&&set.size<2;i++){let m=mutate(o.r);if(m&&Math.random()<.3)m=mutate(m)||m;if(m&&m!==o.r&&m.length>0)set.add(m)}
  const L=[...o.r].length;
  const pool=shuffle(ALLK.filter(x=>x.r!==o.r&&Math.abs([...x.r].length-L)<=1).map(x=>x.r));
  while(set.size<3&&pool.length){const p=pool.shift();if(p!==o.r)set.add(p)}
  return shuffle([o.r,...[...set].slice(0,3)]);
}
function mkKanji(o){return{kind:'kanji',k:o.k,w:o.w,r:o.r,g:o.g,choices:choicesFor(o)}}

function unitHist(id,ok,ms,inTest){

  u.h.push(ok?1:0);u.t.push(Math.round(ms/100)/10);u.h=u.h.slice(-10);u.t=u.t.slice(-10);

const targetUnit=()=>UNITS.find(u=>!(st.units[u.id]&&st.units[u.id].m));

  const t=targetUnit(), done=UNITS.filter(u=>st.units[u.id]&&st.units[u.id].m), out=[];

/* ---------- drawing pad (Apple Pencil: once a pen is seen, finger touches are ignored) ---------- */
function makePad(cv,scale=1){
  const ctx=cv.getContext('2d');let pen=false,drawing=false,last=null,rect=null,strokes=[],line=null,onChange=()=>{};
  function size(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#261F38'}
  size();
  const seg=s=>{ctx.lineWidth=s[4];ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke()};
  const wipe=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore()};
  const pos=e=>[e.clientX-rect.left,e.clientY-rect.top];
  cv.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')pen=true;if(pen&&e.pointerType==='touch')return;rect=cv.getBoundingClientRect();drawing=true;last=pos(e);line=[];try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!drawing||(pen&&e.pointerType==='touch'))return;let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
    for(const ev of evs){const p=pos(ev),s=[last[0],last[1],p[0],p[1],(ev.pointerType==='pen'?1.6+(ev.pressure||.5)*3.4:3)*scale];seg(s);line.push(s);last=p}e.preventDefault()});
  const end=()=>{if(drawing&&line&&line.length){strokes.push(line);onChange(strokes.length)}drawing=false;line=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return{
    clear(){strokes=[];wipe();onChange(0)},
    undo(){strokes.pop();wipe();strokes.forEach(l=>l.forEach(seg));onChange(strokes.length)},
    set onChange(f){onChange=f;f(strokes.length)},
    /* each stroke as a list of [x,y] in CSS px, plus the box width they were drawn in */
    lines(){return{w:cv.getBoundingClientRect().width,ls:strokes.map(l=>[[l[0][0],l[0][1]],...l.map(s=>[s[2],s[3]])])}},
    /* redraw with the given strokes in red (indexes into lines()) */
    mark(bad){const ink=ctx.strokeStyle,red=getComputedStyle(document.documentElement).getPropertyValue('--red').trim()||'#D9433A';wipe();
      strokes.forEach((l,i)=>{ctx.strokeStyle=bad.has(i)?red:ink;l.forEach(seg)});ctx.strokeStyle=ink}};
}

let lastCheer=-1;
function cheer(streak){
  let i;do i=Math.floor(Math.random()*CHEERS.length);while(i===lastCheer);lastCheer=i;
  const bonus=streak>=10&&streak%5===0?`${streak}もん れんぞく！ 凛ちゃん とまらない！`:streak>=3?`${streak}もん れんぞく せいかい！`:'';
  return `<span class="cheer">${CHEERS[i]}${bonus?`<small>${bonus}</small>`:''}</span>`;
}
/* ---------- stroke order + checking (KanjiVG data, CC BY-SA 3.0: paths in a 109×109 box, one per stroke, in order) ---------- */
let STROKES=null;
const loadStrokes=()=>STROKES||(STROKES=fetch('strokes.json').then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>{STROKES=null;return null}));
const SVGNS='http://www.w3.org/2000/svg', NPT=24, refCache={};
function resample(pts,n=NPT){
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=d[d.length-1],out=[];let j=0;
  for(let i=0;i<n;i++){const t=L*i/(n-1);while(j<d.length-2&&d[j+1]<t)j++;const span=d[j+1]-d[j]||1,f=Math.min(1,Math.max(0,(t-d[j])/span)),a=pts[j],b=pts[Math.min(j+1,pts.length-1)];out.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
  return out;
}
function refPoints(k,paths){
  if(refCache[k])return refCache[k];
  const svg=document.createElementNS(SVGNS,'svg');svg.setAttribute('style','position:absolute;width:0;height:0');document.body.appendChild(svg);
  const out=paths.map(dd=>{const p=document.createElementNS(SVGNS,'path');p.setAttribute('d',dd);svg.appendChild(p);const L=p.getTotalLength(),pts=[];
    for(let i=0;i<NPT;i++){const q=p.getPointAtLength(L*i/(NPT-1));pts.push([q.x,q.y])}return pts});
  svg.remove();return refCache[k]=out;
}
const meanDist=(a,b)=>a.reduce((s,p,i)=>s+Math.hypot(p[0]-b[i][0],p[1]-b[i][1]),0)/a.length;
function bbox(ls){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const l of ls)for(const[x,y]of l){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return{cx:(x0+x1)/2,cy:(y0+y1)/2,s:Math.max(x1-x0,y1-y0,1)}}
/* compares the child's strokes with the model, stroke by stroke and in order.
   Size and position are normalised away (only the shape of the whole kanji matters); each stroke is then
   ok / drawn backwards / matches a different stroke (order) / wrong shape. 2=◎ all ok, 1=△ one stroke off, 0=× */
const STROKE_TOL=13;
function judgeStrokes(ref,drawn){
  const px=drawn.w/109, user=drawn.ls.filter(l=>{let L=0;for(let i=1;i<l.length;i++)L+=Math.hypot(l[i][0]-l[i-1][0],l[i][1]-l[i-1][1]);return L/px>=2.5});
  const keep=drawn.ls.map((l,i)=>user.includes(l)?i:-1).filter(i=>i>=0);
  const r={n:ref.length,m:user.length,rev:[],order:[],shape:[]};
  if(r.m!==r.n){r.grade=0;r.why='count';r.bad=[];r.badDrawn=new Set();return r}
  const rb=bbox(ref),ub=bbox(user),sc=rb.s/ub.s;
  const U=user.map(l=>resample(l).map(([x,y])=>[(x-ub.cx)*sc+rb.cx,(y-ub.cy)*sc+rb.cy]));
  U.forEach((u,i)=>{
    if(meanDist(u,ref[i])<=STROKE_TOL)return;
    if(meanDist([...u].reverse(),ref[i])<=STROKE_TOL)r.rev.push(i);
    else if(ref.some((q,j)=>j!==i&&meanDist(u,q)<=STROKE_TOL))r.order.push(i);
    else r.shape.push(i)});
  const wrong=r.rev.length+r.order.length+r.shape.length;
  r.grade=wrong===0?2:wrong===1?1:0;r.why=r.order.length?'order':r.rev.length?'rev':r.shape.length?'shape':'';
  r.bad=[...r.rev,...r.order,...r.shape];r.badDrawn=new Set(r.bad.map(i=>keep[i]));
  return r;
}
/* numbered stroke-order figure; strokes draw themselves one by one (tap to replay). bad = stroke indexes to show in red */
function strokeFig(paths,bad=[]){
  const nums=paths.map((d,i)=>{const m=d.match(/M\s*([\d.]+)[ ,]([\d.]+)/);return m?`<text x="${Math.max(4,+m[1]-5).toFixed(1)}" y="${Math.max(9,+m[2]-2).toFixed(1)}" class="sn${bad.includes(i)?' bad':''}">${i+1}</text>`:''}).join('');
  return `<svg viewBox="0 0 109 109" class="sofig" role="img" aria-label="かきじゅん"><path d="M54.5 0V109M0 54.5H109" class="sog"/>
    ${paths.map(d=>`<path d="${d}" class="sobg"/>`).join('')}${paths.map((d,i)=>`<path d="${d}" class="sos${bad.includes(i)?' bad':''}"/>`).join('')}${nums}</svg>`;
}
function playFig(svg){
  const ps=[...svg.querySelectorAll('.sos')],ns=[...svg.querySelectorAll('.sn')];
  ps.forEach((p,i)=>{const L=p.getTotalLength();p.style.strokeDasharray=L;
    p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:Math.max(350,L*9),delay:i*750,fill:'both',easing:'ease-in-out'});
    if(ns[i])ns[i].animate([{opacity:0},{opacity:1}],{duration:200,delay:i*750,fill:'both'})});
}
const padTools=(u,c)=>`<div class="padtools"><button class="btn small" id="${u}"><span aria-hidden="true">↶</span>1つ もどす</button><button class="btn small" id="${c}"><span aria-hidden="true">🗑</span>ぜんぶ けす</button></div>`;

function hanamaru(size=110){
  const c=60;let d='';
  for(let i=0;i<=600;i+=12){const a=i*Math.PI/180,r=6+i/600*24;d+=(i?'L':'M')+(c+r*Math.cos(a)).toFixed(1)+' '+(c+r*Math.sin(a)).toFixed(1)}
  let q='';const n=9;
  for(let k=0;k<n;k++){const a0=k/n*2*Math.PI,a1=(k+1)/n*2*Math.PI,am=(a0+a1)/2;
    if(!k)q+='M'+(c+36*Math.cos(a0)).toFixed(1)+' '+(c+36*Math.sin(a0)).toFixed(1);
    q+='Q'+(c+58*Math.cos(am)).toFixed(1)+' '+(c+58*Math.sin(am)).toFixed(1)+' '+(c+36*Math.cos(a1)).toFixed(1)+' '+(c+36*Math.sin(a1)).toFixed(1)}
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="はなまる"><path d="${d}" fill="none" stroke="var(--red)" stroke-width="4" stroke-linecap="round"/><path d="${q}" fill="none" stroke="var(--red)" stroke-width="4" stroke-linejoin="round"/></svg>`;
}

/* ---------- quiz runner ---------- */
function runQuiz(opt){
  cur='quiz';const res=[];let item=null,t0=0,locked=false;
  function step(){item=opt.next(res);if(!item){opt.done(res,false);return}locked=false;t0=performance.now();draw();window.scrollTo(0,0)}
  const streak=()=>{let n=0;for(let i=res.length-1;i>=0&&res[i].ok;i--)n++;return n};
  function record(ok,info){const ms=performance.now()-t0;res.push({item,ok,ms,info});opt.onAnswer(item,ok,ms,info);save()}
  function head(){const tot=Math.max(opt.total(res),res.length+1),pct=Math.round(res.length/tot*100);
    return `<div class="qhead"><button class="btn small quit" id="quit" aria-label="とちゅうで やめる"><span aria-hidden="true">✕</span>やめる</button><div class="bar"><i style="width:${pct}%"></i></div><span class="num">${res.length+1} / ${tot}</span></div>`}
  function draw(){
    let body='';
    if(item.kind==='kanji')body=kanjiView(item);
    else if(item.kind==='math')body=mathView(item);
    else body=writeView(item);
    app.innerHTML=`${head()}<h2>${esc(opt.title)}</h2>${body}`;
    document.getElementById('quit').onclick=()=>opt.done(res,true);
    if(item.kind==='kanji')bindKanji();else if(item.kind==='math')bindMath();else bindWrite();
  }
  function kanjiView(it){
    const hl=esc(it.w).replace(esc(it.k),`<span class="tk">${esc(it.k)}</span>`);
    return `<div class="card"><div class="prompt">この ことばの よみかたは？ ${st.en?'<span class="en">How do you read this word?</span>':''}</div>
      <div class="word">${hl}</div>
      <div class="choices">${it.choices.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c)}</button>`).join('')}<button class="choice idk" data-i="-1">わからない</button></div>
      <div class="fb" id="fb"></div></div>`}
  function bindKanji(){
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;const i=+b.dataset.i,ok=i>=0&&item.choices[i]===item.r;
      app.querySelectorAll('.choice').forEach(x=>{const j=+x.dataset.i;if(j>=0&&item.choices[j]===item.r)x.classList.add('ok')});
      if(!ok&&i>=0)b.classList.add('ng');
      record(ok);
      const fb=document.getElementById('fb');
      if(ok){fb.className='fb ok popin';fb.innerHTML=cheer(streak());setTimeout(step,1300)}
      else{fb.className='fb ng';fb.innerHTML=`<span>「${esc(item.w)}」は「${esc(item.r)}」</span><button class="btn primary" id="nx">つぎへ</button>`;document.getElementById('nx').onclick=step}
    })}
  let vals=[],act=0;
  function mathView(it){
    vals=it.type==='num'?['']:['',''];act=0;
    const u=UMAP[it.uid];
    let boxes;
    if(it.type==='num')boxes=`<div class="abox act" data-i="0" tabindex="0"></div><span>${esc(it.unit)}</span>`;
    else if(it.type==='pair')boxes=`<div class="abox act" data-i="0" tabindex="0"></div><span>${it.mid}</span><div class="abox" data-i="1" tabindex="0"></div><span>${it.end}</span>`;
    else boxes=`<div class="fbox"><div class="abox act" data-i="0" tabindex="0"></div><div class="fline"></div><div class="abox" data-i="1" tabindex="0"></div></div><span class="en">上が 分子、下が 分母</span>`;
    const longQ=it.q.replace(/<[^>]+>/g,'').length>16;
    return `<div class="qm"><div class="card">
      <span class="tag">${u.g}年 ${u.ja}${st.en?' · '+u.en:''}</span>
      <div class="mq${longQ?' long':''}">${it.q}</div>
      ${st.en&&it.en?`<div class="en">${it.en}</div>`:''}
      <div class="ans">${boxes}</div>
      <div class="keypad">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button data-k="${k}" aria-label="${k==='⌫'?'1文字けす':k}">${k}</button>`).join('')}</div>
      <button class="btn primary big" id="chk">こたえあわせ</button>
      <div class="fb" id="fb"></div></div>
      <div class="card padwrap"><div class="padhead"><span>けいさんメモ（ペンで かいてね）</span>${padTools('undo','clr')}</div><canvas class="pad" id="pad"></canvas></div></div>`}
  function paintBoxes(){app.querySelectorAll('.abox').forEach(b=>{const i=+b.dataset.i;b.textContent=vals[i];b.classList.toggle('act',i===act)})}
  function bindMath(){
    const pad=makePad(document.getElementById('pad'));bindPadTools(pad,document.getElementById('undo'),document.getElementById('clr'));
    app.querySelectorAll('.abox').forEach(b=>b.onclick=()=>{act=+b.dataset.i;paintBoxes()});
    app.querySelectorAll('.keypad button').forEach(b=>b.onclick=()=>{if(locked)return;const k=b.dataset.k;let v=vals[act];
      if(k==='⌫')v=v.slice(0,-1);else if(k==='.'){if(item.type==='num'&&!v.includes('.'))v=(v||'0')+'.'}else if(v.length<9)v=(v==='0'?'':v)+k;
      vals[act]=v;paintBoxes()});
    document.getElementById('chk').onclick=()=>{
      if(locked)return;const fb=document.getElementById('fb');
      if(vals.some(v=>v===''||v==='.')){fb.className='fb ng shake';fb.textContent='□に こたえを 入れてね';const e=app.querySelector('.abox:empty');if(e){act=+e.dataset.i;paintBoxes()}return}
      let ok;
      if(item.type==='num')ok=Math.abs(parseFloat(vals[0])-item.ans)<1e-9;
      else if(item.type==='pair')ok=+vals[0]===item.ans[0]&&+vals[1]===item.ans[1];
      else{const n=+vals[0],d=+vals[1];ok=d>0&&n*item.ans[1]===item.ans[0]*d}
      locked=true;record(ok);
      if(ok){fb.className='fb ok popin';fb.innerHTML=cheer(streak());setTimeout(step,1300)}
      else{fb.className='fb ng';fb.innerHTML=`<span>こたえは ${item.sol}</span><button class="btn primary" id="nx">つぎへ</button>`;document.getElementById('nx').onclick=step}
    }}
  function writeView(it){
    const blank=esc(it.w).replace(esc(it.k),'□');
    return `<div class="card wcard">
      <div class="whead"><div class="prompt">□に 入る かんじを かこう ${st.en?'<span class="en">Write the missing kanji in the box</span>':''}</div>
        <div class="yomi">${esc(it.r)}</div><div class="word" id="wword">${blank}</div></div>
      <div class="wboxwrap"><div class="wbox"><div class="ghost" id="ghost" hidden>${esc(it.k)}</div><canvas id="wpad"></canvas></div></div>
      <div class="wctrl">${padTools('wundo','wclr')}
        <div class="row wact" id="wact"><button class="btn primary big" id="wchk" disabled>こたえあわせ</button><button class="btn" id="widk">わからない</button></div>
        <div class="wres" id="wres" hidden></div>
        <div id="grade" hidden><p class="prompt fb" id="fb" style="justify-content:center;margin:0 0 8px">じぶんで まるつけ しよう</p>
        <div class="grade3"><button data-g="2">◎ かけた</button><button data-g="1">△ おしい</button><button data-g="0">× まだ</button></div></div></div></div>`}
  function bindWrite(){
    const $=id=>document.getElementById(id), it=item;
    const pad=makePad($('wpad'),2.2);
    let recorded=false, paths=null;
    bindPadTools(pad,$('wundo'),$('wclr'));
    pad.onChange=n=>{$('wundo').disabled=$('wclr').disabled=!n;$('wchk').disabled=!n};
    loadStrokes().then(d=>{paths=d&&d[it.k]});
    const reveal=()=>{$('wword').innerHTML=esc(it.w).replace(esc(it.k),`<span class="wans">${esc(it.k)}</span>`)};
    const rec=g=>{if(recorded)return;recorded=true;locked=true;record(g===2,g)};
    /* no stroke data (offline / failed load): fall back to self-marking as before */
    const selfMark=()=>{reveal();$('ghost').hidden=false;$('wact').hidden=true;$('grade').hidden=false};
    app.querySelectorAll('#grade button').forEach(b=>b.onclick=()=>{if(recorded)return;const g=+b.dataset.g;rec(g);
      if(g===2){const fb=$('fb');fb.className='fb ok popin';fb.innerHTML=cheer(streak());setTimeout(step,1300)}else step()});
    function show(res){
      reveal();const bad=res?res.bad:[];
      const MSG={count:()=>`「${esc(it.k)}」は <b>${res.n}かく</b>。凛ちゃんは ${res.m}かく だったよ`,
        order:()=>'かきじゅんが ちがう ところが あるよ',rev:()=>'ぎゃくむきに かいた 線が あるよ',shape:()=>'かたちが ちがう 線が あるよ'};
      const mark=!res?'':res.grade===2?'◎':res.grade===1?'△':'×';
      const msg=!res?'かきじゅんを 見て、なぞって かいてみよう':res.grade===2?cheer(streak()):MSG[res.why]()+(bad.length?'<br><small>赤い ばんごうの 線を 見てね</small>':'');
      $('wres').innerHTML=`<button class="sobtn" id="replay" aria-label="かきじゅんを もう一回 見る">${strokeFig(paths,bad)}<span>かきじゅん ▶</span></button>
        <div class="wverdict">${mark?`<span class="vmark g${res.grade}">${mark}</span>`:''}<div class="vmsg${res&&res.grade===2?'':' ng'}">${msg}</div>
        <div class="row"><button class="btn" id="again">もう一回 かく</button><button class="btn primary" id="wnext">つぎへ</button></div></div>`;
      $('wres').hidden=false;$('wact').hidden=true;
      const fig=$('wres').querySelector('svg');playFig(fig);$('replay').onclick=()=>playFig(fig);
      $('again').onclick=()=>{pad.clear();$('ghost').hidden=false;$('wres').hidden=true;$('wact').hidden=false;$('widk').hidden=true};
      $('wnext').onclick=step;
    }
    $('wchk').onclick=()=>{
      if(!paths){selfMark();return}
      const res=judgeStrokes(refPoints(it.k,paths),pad.lines());
      pad.mark(res.badDrawn||new Set());rec(res.grade);show(res);
    };
    $('widk').onclick=()=>{if(!paths){selfMark();return}rec(0);$('ghost').hidden=false;show(null)};
  }
  step();
}

/* ---------- flows ---------- */
function onKanjiAnswer(it,ok){if(!it.retry)srsKanji(it.k,ok);logDay('k',ok)}
function onWriteAnswer(it,ok,ms,g){
  const s=st.write[it.k]||(st.write[it.k]={b:0});
  if(g===2)s.b=Math.min(s.b+1,5);else if(g===0)s.b=0;
  s.due=TODAY()+(g===1?1:IV[s.b]);logDay('w',ok);
}
function practice(parts){
  const q=[];
  if(parts.includes('k'))q.push(...kanjiPlan(10));
  if(parts.includes('m'))q.push(...mathPlan(8));
  if(parts.includes('w'))q.push(...writePlan(5));
  const retried=new Set();
  runQuiz({title:parts.length>1?'きょうの れんしゅう':parts[0]==='k'?'かんじの よみ':parts[0]==='m'?'さんすう':'かんじを かこう',
    total:res=>res.length+q.length+1,
    next:()=>q.shift()||null,
    onAnswer(it,ok,ms,info){
      if(it.kind==='kanji'){onKanjiAnswer(it,ok);if(!ok&&!retried.has(it.k)){retried.add(it.k);const again=mkKanji(KINFO[it.k]);again.retry=true;const at=q.findIndex(x=>x.kind!=='kanji');at<0?q.push(again):q.splice(at,0,again)}}
      else if(it.kind==='math'){unitHist(it.uid,ok,ms,false);logDay('m',ok)}
      else onWriteAnswer(it,ok,ms,info);
    },
    done:(res,stopped)=>results('きょうの けっか',res,stopped)});
}
function kanjiTest(){
  const r={};let g=1,queue=shuffle(KJ[1]).slice(0,10);
  runQuiz({title:'かんじ レベルテスト',total:res=>Math.max(res.length+queue.length,g*10),
    next(){
      if(queue.length)return mkKanji(queue.shift());
      const sc=r[g];if(!sc||g===4||sc.c/sc.n<.5)return null;
      g++;queue=shuffle(KJ[g]).slice(0,10);return mkKanji(queue.shift());
    },
    onAnswer(it,ok){const x=r[it.g]||(r[it.g]={c:0,n:0});x.n++;if(ok)x.c++;onKanjiAnswer(it,ok)},
    done(res,stopped){if(res.length){st.kt={r,date:todayStr(),done:!stopped};save()}results('かんじ レベルテスト',res,stopped)}});
}
function mathTest(){
  if(st.mt&&st.mt.done)st.mt=null;
  const u=(st.mt&&st.mt.u)||{};st.mt={u,date:todayStr(),done:false};
  let ui=UNITS.findIndex(x=>!(u[x.id]&&u[x.id].f));if(ui<0)ui=0;let fails=0;
  const finish=un=>{const x=u[un.id];x.f=true;const s=st.units[un.id]||(st.units[un.id]={h:[],t:[],m:false});
    x.slow=!!(un.fast&&x.n&&x.ms/x.n/1000>un.fast);s.m=x.c===x.n;fails=x.c/x.n<.5?fails+1:0};
  runQuiz({title:'さんすう レベルテスト',total:res=>res.length+Math.max(1,(UNITS.length-ui)*2),
    next(){
      while(ui<UNITS.length){
        const un=UNITS[ui],x=u[un.id]||(u[un.id]={c:0,n:0,ms:0});
        if(!x.f&&(x.n<2||(x.n===2&&x.c===1)))return mkMath(un);
        if(!x.f)finish(un);
        ui++;if(fails>=3)return null;
      }
      return null;
    },
    onAnswer(it,ok,ms){const x=u[it.uid];x.n++;x.ms+=ms;if(ok)x.c++;unitHist(it.uid,ok,ms,true);logDay('m',ok)},
    done(res,stopped){st.mt.done=!stopped;st.mt.date=todayStr();save();results('さんすう レベルテスト',res,stopped)}});
}

  const testCard=(!ktDone||!mtDone)?`<div class="card"><h2>まずは レベルテスト</h2><p class="muted">いまの 力を しらべて、ちょうど いい もんだいを 出すよ。とちゅうで やめても だいじょうぶ。</p>
    <div class="grid2"><button class="btn big${ktDone?'':' primary'}" id="kt">かんじ テスト ${ktDone?'（すんだ）':'（やく10分）'}</button>
    <button class="btn big${!ktDone||mtDone?'':' primary'}" id="mt">さんすう テスト ${mtDone?'（すんだ）':st.mt&&st.mt.u&&Object.keys(st.mt.u).length?'（つづきから）':'（やく20分）'}</button></div></div>`:'';
  const today=st.days[todayStr()];
  app.innerHTML=`${topBar()}
    <div class="card hero"><div class="row" style="justify-content:space-between"><div><h1>きょうの れんしゅう</h1>
      <p class="muted">かんじの よみ 10もん ＋ さんすう 8もん（やく15分）${dueN?`・ふくしゅう ${dueN}こ`:''}</p></div>
      ${today&&today.n?`<span class="pill">きょうは ${today.n}もん やったよ</span>`:''}</div>
      <button class="btn primary big" id="daily">はじめる</button></div>
    ${testCard}
    <div class="grid3">
      <button class="card tile" id="pk"><span class="k">読</span><h3>かんじの よみ</h3><span class="muted">${st.kt?`${kl?kl+'年生まで ばっちり':'1年生から'}・${Math.min(4,kl+1)}年生を れんしゅう`:'テストの あとに おすすめが 出るよ'}</span></button>
      <button class="card tile" id="pm"><span class="k">算</span><h3>さんすう</h3><span class="muted">${tu?`いま：${tu.g}年 ${tu.ja}`:'ぜんぶ クリア！'}</span></button>
      <button class="card tile" id="pw"${writable()?'':' disabled'}><span class="k">書</span><h3>かんじを かこう</h3><span class="muted">${writable()?'ペンで 5もん':'よみを おぼえたら できるよ'}</span></button>
    </div>
    <div class="card"><h3>この 1しゅうかん</h3>${weekStrip()}<p class="en">10もん いじょう やった 日に はなまる</p></div>`;
  bindTop();
  document.getElementById('daily').onclick=()=>practice(['k','m']);
  document.getElementById('pk').onclick=()=>practice(['k']);
  document.getElementById('pm').onclick=()=>practice(['m']);
  document.getElementById('pw').onclick=()=>{if(writable())practice(['w'])};
  const kt=document.getElementById('kt'),mt=document.getElementById('mt');
  if(kt)kt.onclick=()=>{if(!ktDone)kanjiTest()};
  if(mt)mt.onclick=()=>{if(!mtDone)mathTest()};
}
function results(title,res,stopped){
  cur='results';
  const n=res.length,c=res.filter(r=>r.ok).length,rate=n?c/n:0;
  const miss=res.filter(r=>!r.ok);
  const kmiss=[...new Map(miss.filter(r=>r.item.kind!=='math').map(r=>[r.item.k,r.item])).values()];
  const mmiss=miss.filter(r=>r.item.kind==='math');
  let extra='';
  if(title.includes('かんじ レベル')&&st.kt){const kl=kanjiLevel();extra=`<p>${kl?`<b>${kl}年生</b>の かんじまで よく 読めているよ。`:''}これからは <b>${Math.min(4,kl+1)}年生</b>の かんじを 中心に れんしゅうしよう。</p>`}
  if(title.includes('さんすう レベル')){const t=targetUnit();extra=`<p>${t?`まずは <b>${t.g}年「${t.ja}」</b> から れんしゅうしよう。`:'ぜんぶの たんげんが できていたよ！'}</p>`}
  app.innerHTML=`${topBar()}<div class="card"><h2>${esc(title)}${stopped?'（とちゅうまで）':''}</h2>
    <div class="score">${n&&rate>=.8?`<span class="popin">${hanamaru(110)}</span>`:''}<div><div class="big">${c} / ${n}</div><p class="muted">${n?rate>=.8?'凛ちゃん すごい！ よく できました':rate>=.5?'いい ちょうし！ まちがえた ところを もう一回':'だいじょうぶ、くりかえせば おぼえられるよ':'まだ もんだいを といていないよ'}</p></div></div>${extra}</div>
    ${kmiss.length?`<div class="card"><h3>もう一回 見ておこう（かんじ）</h3><div class="misslist">${kmiss.map(i=>`<span class="miss"><b>${esc(i.w)}</b>${esc(i.r)}</span>`).join('')}</div></div>`:''}
    ${mmiss.length?`<div class="card"><h3>まちがえた けいさん</h3><div class="misslist">${mmiss.map(r=>`<span class="miss">${r.item.q.replace(/<rt>.*?<\/rt>/g,'')} → ${r.item.sol}</span>`).join('')}</div></div>`:''}
    <div class="row"><button class="btn primary big" id="back">ホームへ</button></div>`;
  bindTop();document.getElementById('back').onclick=home;
}
let confirmFor=null;
function parent(){
  cur='parent';
  const t=TODAY();
  const kRows=[1,2,3,4].map(g=>{const tot=KJ[g].length;let kn=0,lr=0;for(const o of KJ[g]){const s=st.kanji[o.k];if(!s)continue;if(s.b>=3)kn++;else lr++}
    const tr=st.kt&&st.kt.r[g];
    return `<div class="kbar"><span>${g}年生</span><div class="stack" role="img" aria-label="${g}年生 ${tot}字中 読める${kn} 練習中${lr}"><i style="width:${kn/tot*100}%;background:var(--ok)"></i><i style="width:${lr/tot*100}%;background:var(--gold)"></i></div><span>${kn} / ${tot}字${tr?` <span class="muted">(テスト ${tr.c}/${tr.n})</span>`:''}</span></div>`}).join('');
  const uRows=UNITS.map(u=>{const s=st.units[u.id],x=st.mt&&st.mt.u&&st.mt.u[u.id];
    let chip='<span class="chip n">まだ</span>';
    if(s&&s.m)chip='<span class="chip m">できた</span>';else if(s&&s.h.length)chip='<span class="chip l">練習中</span>';
    const acc=s&&s.h.length?Math.round(avg(s.h)*100)+'%':'—',tm=s&&s.t.length?avg(s.t).toFixed(1)+'秒':'—';
    const slow=x&&x.slow?' <span class="chip s">遅め</span>':'';
    return `<tr><td>${u.g}年</td><td>${u.ja}<div class="en">${u.en}</div></td><td>${chip}${slow}</td><td>${acc}</td><td>${tm}</td><td>${x&&x.n?`${x.c}/${x.n}`:'—'}</td></tr>`}).join('');
  const hard=Object.entries(st.kanji).filter(([k,s])=>s.w>0&&KINFO[k]).sort((a,b)=>b[1].w-a[1].w||a[1].b-b[1].b).slice(0,16);
  const days=[];{const d=new Date();d.setDate(d.getDate()-13);for(let i=0;i<14;i++){days.push(todayStr(d));d.setDate(d.getDate()+1)}}
  const maxN=Math.max(10,...days.map(s=>st.days[s]?st.days[s].n:0));
  const bars=days.map((s,i)=>{const x=st.days[s];const h=x?Math.max(3,x.n/maxN*80):0;return `<rect x="${i*30+6}" y="${90-h}" width="18" height="${h}" rx="3" fill="var(--accent)"/><text x="${i*30+15}" y="106" font-size="10" text-anchor="middle" fill="var(--muted)">${+s.slice(8)}</text>`}).join('');
  const total=sum(Object.values(st.days).map(x=>x.n)),okAll=sum(Object.values(st.days).map(x=>x.ok));
  const sync=!storeOk?'この端末に保存できません（プライベートブラウズでは保存されません）':'記録はこのiPadの中に保存しています'+(standalone()?'（ホーム画面から起動中）':'。Safariの共有ボタン→「ホーム画面に追加」から使うと、記録が消えにくくなります');
  const last=st.lastBackup?`前回のバックアップ：${st.lastBackup}`:'まだバックアップしていません';
  const cf=k=>confirmFor===k?`<div class="confirm"><span>本当に やりなおしますか？ ${k==='all'?'すべての記録が消えます。':'テストの結果だけ消えます（練習の記録は残ります）。'}</span><button class="btn small primary" data-yes="${k}">はい</button><button class="btn small" data-no="1">やめる</button></div>`:'';
  app.innerHTML=`<div class="top"><div class="brand"><b>おうちの人へ</b><span>学習の記録</span></div><button class="btn small" id="home">← こどもの画面</button></div>
    <div class="grid3">
      <div class="card"><span class="muted">漢字（読み）</span><h2>${st.kt?kanjiLevel()?kanjiLevel()+'年生まで定着':'1年生から':'テスト前'}</h2><span class="en">${st.kt?'テスト日 '+st.kt.date:'レベルテスト未実施'}</span></div>
      <div class="card"><span class="muted">算数 いまの単元</span><h2>${targetUnit()?targetUnit().g+'年 '+targetUnit().ja:'全単元クリア'}</h2><span class="en">${st.mt?'テスト日 '+st.mt.date+(st.mt.done?'':'（途中）'):'レベルテスト未実施'}</span></div>
      <div class="card"><span class="muted">これまで</span><h2>${total}問・正答率 ${total?Math.round(okAll/total*100):0}%</h2><span class="en">連続 ${streak()}日</span></div>
    </div>
    <div class="card"><h3>漢字の読み（学年別）</h3>${kRows}
      <div class="legend"><span><i style="background:var(--ok)"></i>読める（3回目以降の正解が続いている）</span><span><i style="background:var(--gold)"></i>練習中</span><span><i style="background:var(--line)"></i>まだ出していない</span></div>
      <p class="en">間違えた漢字は 翌日→3日後→1週間後… と間隔をあけて また出ます。</p></div>
    ${hard.length?`<div class="card"><h3>間違えが多い漢字</h3><div class="misslist">${hard.map(([k,s])=>`<span class="miss"><b>${esc(KINFO[k].w)}</b>${esc(KINFO[k].r)} <span class="muted">×${s.w}</span></span>`).join('')}</div></div>`:''}
    <div class="card"><h3>算数（単元別）</h3><div class="tablewrap"><table><thead><tr><th>学年</th><th>単元</th><th>状態</th><th>直近の正答率</th><th>平均時間</th><th>テスト</th></tr></thead><tbody>${uRows}</tbody></table></div>
      <p class="en">「できた」= 直近8問で7問以上正解。レベルテストでは全問正解なら「できた」（時間がかかったものは「遅め」と表示）。ふだんの練習では、たし算・ひき算・九九・わり算は 1問あたりの時間も見ています（遅めだと「できた」になりません）。</p></div>
    <div class="card"><h3>この2週間</h3><div class="tablewrap"><svg viewBox="0 0 420 112" width="100%" style="max-width:640px;min-width:320px" role="img" aria-label="日ごとの問題数"><line x1="0" y1="90" x2="420" y2="90" stroke="var(--line)"/>${bars}</svg></div><p class="en">1日あたりの問題数（目安 18問）</p></div>
    <div class="card"><h3>設定</h3>
      <button class="toggle" id="enT"><span class="sw${st.en?' on':''}"></span><span>英語のヒントを表示する（UWCで英語で習っている用語の補助）</span></button>
      <p class="en">${sync}</p></div>
    <div class="card"><h3>バックアップ</h3>
      <p class="muted">iPadを買い替えるときや、念のための控えに。月に1回くらいファイルに保存しておくと安心です。</p>
      <div class="row"><button class="btn small primary" id="bkSave">ファイルに保存</button><button class="btn small" id="bkCopy">コピーする</button><label class="btn small" for="bkFile">ファイルから読み込む</label><input type="file" id="bkFile" accept=".json,application/json,text/plain" hidden></div>
      <p class="en">${last}</p>
      ${backupMsg?`<p class="${backupMsg.startsWith('×')?'fb ng':'fb ok'}">${esc(backupMsg)}</p>`:''}
      ${pendingRestore?`<div class="confirm"><span>このバックアップ（${esc(pendingRestore.when)}）で 今の記録を上書きしますか？</span><button class="btn small primary" id="rsYes">上書きする</button><button class="btn small" id="rsNo">やめる</button></div>`:''}</div>
    <div class="card"><h3>やりなおし</h3>
      <div class="row"><button class="btn small" data-reset="kt">漢字テストをやりなおす</button><button class="btn small" data-reset="mt">算数テストをやりなおす</button><button class="btn small" data-reset="all">すべての記録を消す</button></div>
      ${cf('kt')}${cf('mt')}${cf('all')}</div>
    <p class="en">書き順データ：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（Ulrich Apel, CC BY-SA 3.0）。書き取りの自動判定は、画数・書き順・線の向きと形を見ています（とめ・はね・はらいは見ていません）。</p>`;
  document.getElementById('home').onclick=()=>{confirmFor=null;backupMsg='';pendingRestore=null;home()};
  document.getElementById('enT').onclick=()=>{st.en=!st.en;save();parent()};
  const stamp=()=>{st.lastBackup=todayStr();save()};
  document.getElementById('bkSave').onclick=()=>{
    const blob=new Blob([backupText()],{type:'application/json'}),name=`manabi-backup-${todayStr()}.json`;
    const file=window.File?new File([blob],name,{type:'application/json'}):null;
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(()=>{stamp();backupMsg='○ 保存しました';parent()}).catch(()=>{})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);stamp();backupMsg='○ ファイルを書き出しました';parent()}
  };
  document.getElementById('bkCopy').onclick=()=>{
    navigator.clipboard.writeText(backupText()).then(()=>{stamp();backupMsg='○ コピーしました。メモアプリなどに貼りつけて保存してください';parent()}).catch(()=>{backupMsg='× コピーできませんでした。「ファイルに保存」を使ってください';parent()});
  };
  document.getElementById('bkFile').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    f.text().then(t=>{try{const o=JSON.parse(t);const d=o.app==='manabi-note'?o.data:o;if(!d||!d.kanji||!d.units)throw 0;pendingRestore={text:t,when:o.saved?o.saved.slice(0,10):'日付不明'};backupMsg=''}catch(_){pendingRestore=null;backupMsg='× まなびノートのバックアップファイルではないようです'}parent()});
  };
  const rsYes=document.getElementById('rsYes');
  if(rsYes){rsYes.onclick=()=>{try{restoreFrom(pendingRestore.text);backupMsg='○ 読み込みました'}catch(_){backupMsg='× 読み込めませんでした'}pendingRestore=null;parent()};
    document.getElementById('rsNo').onclick=()=>{pendingRestore=null;parent()}}
  app.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{confirmFor=b.dataset.reset;parent()});
  app.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{confirmFor=null;parent()});
  app.querySelectorAll('[data-yes]').forEach(b=>b.onclick=()=>{const k=b.dataset.yes;
    if(k==='kt')st.kt=null;else if(k==='mt')st.mt=null;else{const en=st.en;st=fresh();st.en=en}
    confirmFor=null;save();parent()});
}
home();
</script>
